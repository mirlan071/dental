spring:
  application:
    name: dental-crm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dental_crm}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
